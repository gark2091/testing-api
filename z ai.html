<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Chat - Uwaw Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Background Bergerak (Gradient Animation) */
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }
        /* Efek Ketik Bouncing Dot */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .dot-1 { animation: bounce-slow 0.8s infinite ease-in-out; }
        .dot-2 { animation: bounce-slow 0.8s infinite ease-in-out 0.2s; }
        .dot-3 { animation: bounce-slow 0.8s infinite ease-in-out 0.4s; }
    </style>
</head>
<body class="animated-bg min-h-screen text-slate-100 flex flex-col items-center justify-center p-2 sm:p-6">

    <!-- Container Utama -->
    <div class="w-full max-w-4xl h-[92vh] sm:h-[88vh] glass-panel rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-purple-500/30">
        
        <!-- Header Chat -->
        <div class="px-6 py-4 bg-slate-900/60 border-b border-white/10 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/40 text-white font-bold text-lg animate-pulse">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-wide flex items-center gap-2">
                        DeepSeek AI <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 font-normal">Flash V4</span>
                    </h1>
                    <p class="text-xs text-slate-400">Online & Siap Membantu 🚀</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearChat()" class="text-xs px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 transition-all border border-white/10 flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>

        <!-- Ruang Pesan (Chat Box) -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
            <!-- Pesan Sambutan Bot -->
            <div class="flex items-start space-x-3 animate-fade-in">
                <div class="w-8 h-8 rounded-lg bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-purple-300 shrink-0 mt-1">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="max-w-[80%] sm:max-w-[70%] bg-slate-800/80 border border-white/10 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-slate-200 message-glow">
                    Halo! Saya asisten AI Anda yang siap membantu menjawab berbagai pertanyaan dengan cepat dan keren. Ada yang bisa saya bantu hari ini? ✨
                </div>
            </div>
        </div>

        <!-- Indikator Mengetik (Hidden by default) -->
        <div id="typing-indicator" class="hidden px-6 py-2 flex items-center space-x-3 text-slate-400 text-xs">
            <div class="w-6 h-6 rounded-md bg-purple-600/30 flex items-center justify-center text-purple-300">
                <i class="fa-solid fa-robot text-xs"></i>
            </div>
            <div class="bg-slate-800/50 border border-white/10 px-4 py-2.5 rounded-xl flex items-center space-x-1.5">
                <span class="w-2 h-2 bg-purple-400 rounded-full dot-1"></span>
                <span class="w-2 h-2 bg-purple-400 rounded-full dot-2"></span>
                <span class="w-2 h-2 bg-purple-400 rounded-full dot-3"></span>
            </div>
        </div>

        <!-- Form Input Pesan -->
        <div class="p-4 bg-slate-900/80 border-t border-white/10 backdrop-blur-md">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                <div class="relative flex-1">
                    <input type="text" id="user-input" placeholder="Ketik pesan atau tanyakan sesuatu..." autocomplete="off"
                        class="w-full bg-slate-800/80 border border-white/10 focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/20 text-slate-100 placeholder-slate-400 text-sm rounded-xl px-4 py-3.5 outline-none transition-all shadow-inner">
                </div>
                <button type="submit" id="send-btn"
                    class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium px-5 py-3.5 rounded-xl transition-all shadow-lg shadow-purple-600/30 flex items-center justify-center shrink-0 active:scale-95">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- JavaScript Logika Koneksi API -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // Simpan riwayat obrolan untuk konteks percakapan
        let conversationHistory = [
            { role: "system", content: "Anda adalah asisten AI yang ramah, interaktif, dan membantu." }
        ];

        async function handleSendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Tambahkan pesan user ke UI
            appendMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });
            userInput.value = '';
            
            // Scroll otomatis ke bawah
            scrollToBottom();

            // Tampilkan indikator mengetik
            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            try {
                // Kirim request ke endpoint API Anda
                const response = await fetch("http://api.rootly.my.id:40024/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer sk-rootly-I3dNPfKII8KdYDHG2gVJcC9453UGMKSxRTH5cCCIWgw",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "deepseek-ai/DeepSeek-V4-Flash-0731",
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                
                // Sembunyikan indikator mengetik
                typingIndicator.classList.add('hidden');

                if (response.ok && data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content;
                    appendMessage(botReply, 'bot');
                    conversationHistory.push({ role: "assistant", content: botReply });
                } else {
                    appendMessage("Maaf, terjadi kesalahan saat menghubungi server AI.", 'bot');
                }
            } catch (error) {
                typingIndicator.classList.add('hidden');
                appendMessage("Gagal terhubung ke endpoint API. Pastikan server aktif atau jaringan internet stabil.", 'bot');
                console.error(error);
            }

            scrollToBottom();
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 animate-fade-in ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatarBg = isUser ? 'bg-indigo-600/30 border-indigo-500/40 text-indigo-300' : 'bg-purple-600/30 border-purple-500/40 text-purple-300';
            const bubbleStyle = isUser 
                ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-2xl rounded-tr-sm shadow-md' 
                : 'bg-slate-800/80 border border-white/10 text-slate-200 rounded-2xl rounded-tl-sm message-glow';

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-lg ${avatarBg} border flex items-center justify-center shrink-0 mt-1 shadow-sm">
                    <i class="fa-solid ${isUser ? 'fa-user text-xs' : 'fa-robot text-sm'}"></i>
                </div>
                <div class="max-w-[80%] sm:max-w-[70%] px-4 py-3 text-sm leading-relaxed ${bubbleStyle}">
                    ${escapeHtml(text)}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3 animate-fade-in">
                    <div class="w-8 h-8 rounded-lg bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-purple-300 shrink-0 mt-1">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="max-w-[80%] sm:max-w-[70%] bg-slate-800/80 border border-white/10 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-slate-200 message-glow">
                        Obrolan telah direset. Ada hal lain yang ingin kita bahas? 🌟
                    </div>
                </div>
            `;
            conversationHistory = [
                { role: "system", content: "Anda adalah asisten AI yang ramah, interaktif, dan membantu." }
            ];
        }

        function escapeHtml(string) {
            return string
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/\n/g, "<br>");
        }
    </script>
</body>
</html>
